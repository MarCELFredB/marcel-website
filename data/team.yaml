- name: Dr Nicole Esteban
  role: Principal Investigator / Associate Professor
  email: n.esteban@swansea.ac.uk
  bio: Nicole leads the Marine Conservation Ecology Lab with 20+ years of experience
    in tropical coastal ecosystems and integrated coastal zone management. Her research
    focuses on spatial and habitat use by marine fauna, particularly sea turtles and
    fisheries. She has extensive experience managing Marine Parks and National Parks
    in the Caribbean, and her current work spans the Indian Ocean, Caribbean, Red
    Sea, Mediterranean, and locally in Swansea Bay.
